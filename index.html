<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyomaa Energy - Lead CRM System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1C242E 0%, #2a3744 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 56px;
            font-weight: 800;
            color: #1C242E;
            letter-spacing: -2px;
            line-height: 1;
        }

        .logo-text .highlight {
            color: #56D54F;
        }

        .logo-subtitle {
            font-size: 18px;
            color: #56D54F;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .tagline {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .tagline strong {
            color: #1C242E;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 18px 35px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #56D54F;
            color: #1C242E;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            background: #4ac043;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(86, 213, 79, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #1C242E;
            border: 2px solid #56D54F;
        }

        .btn-secondary:hover {
            background: #f0fdf0;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(86, 213, 79, 0.2);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .feature {
            text-align: center;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 13px;
            color: #666;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .welcome-container {
                padding: 40px 25px;
            }

            .logo-text {
                font-size: 42px;
            }

            .logo-subtitle {
                font-size: 15px;
                letter-spacing: 3px;
            }

            .tagline {
                font-size: 16px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .btn {
                padding: 16px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo">
            <div class="logo-text">vy<span class="highlight">o</span>maa</div>
            <div class="logo-subtitle">ENERGY</div>
        </div>

        <div class="tagline">
            <strong>Powering Your Future</strong><br>
            Comprehensive Lead Management & Customer Relationship System
        </div>

        <div class="button-group">
            <a href="login.html" class="btn btn-primary">Access CRM Dashboard</a>
            <a href="lead-capture.html" class="btn btn-secondary">Submit Lead Inquiry</a>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Solar & Battery Solutions</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">Complete Lead Tracking</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Secure & Reliable</div>
            </div>
        </div>
    </div>

    <script>
        // Redirect to login page as the primary entry point
        window.location.href = 'login.html';
    </script>
</body>
</html>
