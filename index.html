<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Tracker - Simple & Secure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #555;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #f56565;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-clear {
            background: #fc8181;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-clear:hover {
            background: #f56565;
        }

        .search-filter-bar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-group {
            display: flex;
            gap: 10px;
        }

        .search-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-width: 150px;
        }

        .leads-table {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f7fafc;
        }

        th {
            padding: 15px;
            text-align: left;
            color: #667eea;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #555;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-new {
            background: #bee3f8;
            color: #2c5282;
        }

        .status-contacted {
            background: #fef5e7;
            color: #975a16;
        }

        .status-qualified {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-converted {
            background: #d4edda;
            color: #155724;
        }

        .status-lost {
            background: #fed7d7;
            color: #742a2a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .search-filter-bar {
                grid-template-columns: 1fr;
            }

            .search-group {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .show {
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 Lead Tracker</h1>
            <p>Simple, secure lead management - all data stored locally on your device</p>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="success-message">
            Lead added successfully! ✓
        </div>

        <!-- Add New Lead Form -->
        <div class="card">
            <h2>➕ Add New Lead</h2>
            <form id="leadForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" placeholder="+1 234 567 8900">
                    </div>
                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" placeholder="Acme Inc.">
                    </div>
                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" required>
                            <option value="New">New</option>
                            <option value="Contacted">Contacted</option>
                            <option value="Qualified">Qualified</option>
                            <option value="Converted">Converted</option>
                            <option value="Lost">Lost</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="notes">Notes</label>
                        <textarea id="notes" placeholder="Additional information about this lead..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Add Lead</button>
            </form>
        </div>

        <!-- Statistics -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3 id="totalLeads">0</h3>
                <p>Total Leads</p>
            </div>
            <div class="stat-card">
                <h3 id="newLeads">0</h3>
                <p>New Leads</p>
            </div>
            <div class="stat-card">
                <h3 id="convertedLeads">0</h3>
                <p>Converted</p>
            </div>
        </div>

        <!-- View Leads -->
        <div class="card">
            <h2>📋 All Leads</h2>

            <!-- Search and Filter -->
            <div class="search-filter-bar">
                <div class="search-group">
                    <input type="text" id="searchInput" placeholder="🔍 Search by name, email, company...">
                    <select id="filterStatus">
                        <option value="">All Statuses</option>
                        <option value="New">New</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Qualified">Qualified</option>
                        <option value="Converted">Converted</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                <button class="btn btn-clear" onclick="clearAllLeads()">Clear All Data</button>
            </div>

            <!-- Leads Table -->
            <div class="leads-table">
                <table id="leadsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Company</th>
                            <th>Status</th>
                            <th>Date Added</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leadsBody">
                        <!-- Leads will be inserted here -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <h3>No leads yet</h3>
                    <p>Add your first lead using the form above</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load leads from localStorage
        function getLeads() {
            const leads = localStorage.getItem('leads');
            return leads ? JSON.parse(leads) : [];
        }

        // Save leads to localStorage
        function saveLeads(leads) {
            localStorage.setItem('leads', JSON.stringify(leads));
        }

        // Add new lead
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const lead = {
                id: Date.now(),
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                status: document.getElementById('status').value,
                notes: document.getElementById('notes').value,
                dateAdded: new Date().toLocaleDateString()
            };

            const leads = getLeads();
            leads.push(lead);
            saveLeads(leads);

            // Show success message
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);

            // Reset form
            this.reset();

            // Refresh display
            displayLeads();
            updateStats();
        });

        // Delete lead
        function deleteLead(id) {
            if (confirm('Are you sure you want to delete this lead?')) {
                let leads = getLeads();
                leads = leads.filter(lead => lead.id !== id);
                saveLeads(leads);
                displayLeads();
                updateStats();
            }
        }

        // Clear all leads
        function clearAllLeads() {
            if (confirm('Are you sure you want to delete ALL leads? This cannot be undone!')) {
                localStorage.removeItem('leads');
                displayLeads();
                updateStats();
            }
        }

        // Get status badge class
        function getStatusClass(status) {
            const statusMap = {
                'New': 'status-new',
                'Contacted': 'status-contacted',
                'Qualified': 'status-qualified',
                'Converted': 'status-converted',
                'Lost': 'status-lost'
            };
            return statusMap[status] || 'status-new';
        }

        // Display leads
        function displayLeads() {
            const leads = getLeads();
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;

            // Filter leads
            let filteredLeads = leads.filter(lead => {
                const matchesSearch =
                    lead.name.toLowerCase().includes(searchTerm) ||
                    lead.email.toLowerCase().includes(searchTerm) ||
                    lead.company.toLowerCase().includes(searchTerm) ||
                    lead.phone.toLowerCase().includes(searchTerm);

                const matchesStatus = !filterStatus || lead.status === filterStatus;

                return matchesSearch && matchesStatus;
            });

            const tbody = document.getElementById('leadsBody');
            const emptyState = document.getElementById('emptyState');
            const table = document.getElementById('leadsTable');

            if (filteredLeads.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            emptyState.style.display = 'none';

            tbody.innerHTML = filteredLeads.map(lead => `
                <tr>
                    <td><strong>${lead.name}</strong></td>
                    <td>${lead.email || '-'}</td>
                    <td>${lead.phone || '-'}</td>
                    <td>${lead.company || '-'}</td>
                    <td><span class="status-badge ${getStatusClass(lead.status)}">${lead.status}</span></td>
                    <td>${lead.dateAdded}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-danger" onclick="deleteLead(${lead.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            const leads = getLeads();
            document.getElementById('totalLeads').textContent = leads.length;
            document.getElementById('newLeads').textContent = leads.filter(l => l.status === 'New').length;
            document.getElementById('convertedLeads').textContent = leads.filter(l => l.status === 'Converted').length;
        }

        // Search and filter event listeners
        document.getElementById('searchInput').addEventListener('input', displayLeads);
        document.getElementById('filterStatus').addEventListener('change', displayLeads);

        // Initial load
        displayLeads();
        updateStats();
    </script>
</body>
</html>
